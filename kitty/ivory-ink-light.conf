## blurb:    Near-white minimal light theme ported from Ivory Ink for Zed

# The basic colors
foreground              #0B0F0C
background              #FFFFFF
selection_foreground    #0B0F0C
selection_background    #B8D7FF

# Cursor colors
cursor                  #0B0F0C
cursor_text_color       #FFFFFF

# Scrollbar colors
scrollbar_handle_color  #DDDDD9
scrollbar_track_color   #F8F8F5

# URL color when hovering with mouse
url_color               #003EA8

# Kitty window border colors
active_border_color     #0057B8
inactive_border_color   #A8AAA5
bell_border_color       #7A4E00

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #0B0F0C
active_tab_background   #FFFFFF
inactive_tab_foreground #101411
inactive_tab_background #F7F7F4
tab_bar_background      #F8F8F5

# Colors for marks (marked text in the terminal)
mark1_foreground #FFFFFF
mark1_background #005A2E
mark2_foreground #FFFFFF
mark2_background #A00018
mark3_foreground #FFFFFF
mark3_background #003EA8

# The 16 terminal colors

# black
color0  #0B0F0C
color8  #4A544E

# red
color1  #A00018
color9  #C4002A

# green
color2  #005A2E
color10 #007A3D

# yellow
color3  #6B4300
color11 #8A5A00

# blue
color4  #003EA8
color12 #005FCC

# magenta
color5  #5A1A88
color13 #7A2DA8

# cyan
color6  #005F6B
color14 #007D8C

# white
color7  #4A544E
