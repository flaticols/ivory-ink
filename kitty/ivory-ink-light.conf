# green
color2  #006B35
color10 #008F45

# yellow
color3  #6B4D00
color11 #8F6900

# blue
color4  #0057B8
color12 #006FDB

# magenta
color5  #6B238E
color13 #8B2FB0

# cyan
color6  #006A7A
