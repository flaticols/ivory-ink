# red
color1  #A00024
color9  #C01635

# green
color2  #006B35
color10 #008A45

# yellow
color3  #6E5000
color11 #8A6500

# blue
color4  #005EA8
color12 #0078D4

# magenta
color5  #6D238A
color13 #8A35A8

