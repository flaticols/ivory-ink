# The basic colors
foreground              #F3EFE4
background              #1C1C1C
selection_foreground    #FFFFFF
selection_background    #1E4F78

# Cursor colors
cursor                  #FFFFFF
cursor_text_color       #0B0F12

# Scrollbar colors
scrollbar_handle_color  #5A6661
scrollbar_track_color   #070A0C

# URL color when hovering with mouse
url_color               #FFD24A

# Kitty window border colors
active_border_color     #5CB8FF
inactive_border_color   #76837E
bell_border_color       #FFD24A

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #FFFFFF
active_tab_background   #151A1E
inactive_tab_foreground #C8D0C9
inactive_tab_background #1C1C1C
tab_bar_background      #070A0C

# Colors for marks (marked text in the terminal)
mark1_foreground #0B0F12
mark1_background #40E071
mark2_foreground #0B0F12
mark2_background #FF625A
mark3_foreground #0B0F12
mark3_background #5CB8FF

